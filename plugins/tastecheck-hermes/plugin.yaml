name: tastecheck-hermes
version: "0.2.0"
manifest_version: 2
description: "Frontend ship gate for Hermes: runs the Tastecheck browser audit on the real rendered page and returns a fail-closed SHIP / HOLD verdict with evidence. Blocks kanban_complete / kanban_request_review calls that declare frontend work until a fresh, signed SHIP covers it. Runs a vendored, hash-verified CLI (no network fetch; needs Node >=22 and a local Chrome/Chromium); data lives under <HERMES_HOME>/plugin-data/tastecheck-hermes/. See README for the full disclosure."
author: "Kyanite Labs"
license: MIT
homepage: https://github.com/KyaniteLabs/tastecheck/tree/main/plugins/tastecheck-hermes
tags: [frontend, design, ui, ship-gate, audit, accessibility, local-first]
requires_hermes: ">=0.21.6"
requires_env: []
provides_tools:
  - tastecheck_audit
  - tastecheck_profile
  - tastecheck_version
provides_hooks:
  - pre_llm_call
  - pre_tool_call
hooks:
  - pre_llm_call
  - pre_tool_call
config_schema:
  tastecheck_command:
    type: str
    default: ""
    description: "CLI prefix override (e.g. 'tastecheck' if installed globally). Empty (default) = the CLI vendored inside this plugin, verified against vendor/MANIFEST.json before every run (recommended; no npm, no network)."
  inject_on_ship:
    type: bool
    default: true
    description: "When true, pre_llm_call injects a ship-gate brief if the message claims frontend/UI work is done or ready to ship."
  allow_audit_slash_on_gateway:
    type: bool
    default: false
    description: "When false, /tastecheck audit is refused on gateway platforms (it opens local files/URLs in a browser)."
  timeout_seconds:
    type: int
    default: 240
    description: "Overall deadline for one CLI call (an audit's cold-start retry shares it). Also sets the retention grace window (2x this, min 600s) that protects in-flight audits from pruning."
  gate_completions:
    type: bool
    default: true
    description: "When true, pre_tool_call vetoes completion-class tool calls (kanban_complete / kanban_request_review) that declare frontend work (structured artifact fields, metadata.tastecheck/frontend, or a card marker) unless a fresh signed SHIP covers it. Fail closed."
  gate_ship_ttl_seconds:
    type: int
    default: 21600
    description: "How recent a SHIP of a local page must be to satisfy the completion gate (default 6h)."
  gate_url_ship_ttl_seconds:
    type: int
    default: 1800
    description: "How recent a SHIP of an http(s) URL must be (default 30 min). A URL's content cannot be hashed, so URL SHIPs are also bound to the workspace they were recorded in."
