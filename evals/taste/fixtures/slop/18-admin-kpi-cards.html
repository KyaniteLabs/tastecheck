<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Roboto,Arial,sans-serif;background:#f4f6f8;color:#263238}
header{background:#1976d2;color:#fff;padding:18px 32px;font-size:20px}main{max-width:1100px;margin:0 auto;padding:32px 24px}h2{font-weight:500;margin:0 0 20px}
.k{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.kc{background:#fff;border-radius:8px;padding:22px;box-shadow:0 2px 4px rgba(0,0,0,.12)}
.kc span{color:#78909c;font-size:13px;text-transform:uppercase}.kc strong{display:block;font-size:36px;margin-top:8px}
.panel{background:#fff;border-radius:8px;padding:24px;margin-top:24px;box-shadow:0 2px 4px rgba(0,0,0,.12)}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #eceff1}
@media(max-width:700px){.k{grid-template-columns:1fr 1fr}}
</style></head><body><header>Admin Dashboard</header><main><h2>Overview</h2>
<div class="k"><div class="kc"><span>Total users</span><strong>12,481</strong></div><div class="kc"><span>Revenue</span><strong>84%</strong></div><div class="kc"><span>Orders</span><strong>3,204</strong></div><div class="kc"><span>Growth</span><strong>+12%</strong></div></div>
<div class="panel"><table><tr><th>Order</th><th>Customer</th><th>Status</th></tr><tr><td>#1042</td><td>J. Smith</td><td>Shipped</td></tr><tr><td>#1043</td><td>A. Lee</td><td>Pending</td></tr></table></div></main></body></html>
