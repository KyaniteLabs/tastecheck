<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>deslop</title><style>
body{font-family:system-ui;margin:0;padding:2rem;display:grid;gap:2rem}.slop .cta{border-radius:9999px;background-color:#4f46e5;background-image:linear-gradient(135deg,#4f46e5,#7e22ce);color:#fff;padding:.7em 1.4em;border:0}.slop .card{box-shadow:0 25px 50px -12px rgba(0,0,0,.5);border-radius:16px;padding:1.5rem;text-align:center}.fixed .cta{border-radius:8px;background:#0d7d74;color:#fff;padding:.7em 1.4em;border:0}.fixed .card{box-shadow:none;border:1px solid #e3e3e6;border-radius:12px;padding:1.5rem}h1{margin:0}h2{margin:.2rem 0}main{display:grid;gap:2rem}</style></head><body>
<main>
<h1>deslop-ui demo</h1>
<section class=slop><h2>Before (slop): pill CTA, purple gradient, emoji header, shadow-2xl</h2><div class=card>card<br><button class=cta>Get started</button></div></section>
<section class=fixed><h2>After (desloped): 8px radius, committed hue, real heading, flat+border</h2><div class=card>card<br><button class=cta>Get started</button></div></section>
</main>
</body></html>
