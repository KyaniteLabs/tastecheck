<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>foundations</title><style>
/* ============================================================================
   theming — starter. Semantic tokens, surface ramp (elevation by lightness),
   color-scheme, prefers-color-scheme default + persistent manual override.
   Pair with color-system (palette) and web-typography (text).
   ========================================================================== */

:root {
  color-scheme: light;
  --bg:        #ffffff;
  --surface-1: #f7f7f8;
  --surface-2: #efeff1;
  --surface-3: #e8e8eb;
  --text:      #1a1a1a;
  --text-muted:#5b5b5e;
  --border:    #e3e3e6;
  --accent:    oklch(0.55 0.16 250);
  --success:   oklch(0.52 0.15 150);
  --error:     oklch(0.55 0.20 25);
  --warning:   oklch(0.65 0.15 85);
  --shadow-float: 0 8px 24px rgb(0 0 0 / .12);
}

/* Dark via OS preference */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg:        #121212;                 /* never #000 */
    --surface-1: color-mix(in oklab, white 6%,  var(--bg));
    --surface-2: color-mix(in oklab, white 9%,  var(--bg));
    --surface-3: color-mix(in oklab, white 12%, var(--bg));
    --text:      #ececec;                 /* never #fff */
    --text-muted:#a0a0a6;
    --border:    color-mix(in oklab, white 14%, var(--bg));
    --accent:    oklch(0.72 0.12 250);    /* +L, -C vs light */
    --success:   oklch(0.78 0.15 150);
    --error:     oklch(0.72 0.17 25);
    --warning:   oklch(0.82 0.14 85);
    --shadow-float: 0 8px 30px rgb(0 0 0 / .5);
  }
}

/* Dark via explicit user toggle (wins over OS) */
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg:        #121212;
  --surface-1: color-mix(in oklab, white 6%,  var(--bg));
  --surface-2: color-mix(in oklab, white 9%,  var(--bg));
  --surface-3: color-mix(in oklab, white 12%, var(--bg));
  --text:      #ececec;
  --text-muted:#a0a0a6;
  --border:    color-mix(in oklab, white 14%, var(--bg));
  --accent:    oklch(0.72 0.12 250);
  --success:   oklch(0.78 0.15 150);
  --error:     oklch(0.72 0.17 25);
  --warning:   oklch(0.82 0.14 85);
  --shadow-float: 0 8px 30px rgb(0 0 0 / .5);
}

body { background: var(--bg); color: var(--text); }
.card        { background: var(--surface-1); border: 1px solid var(--border); }
.card.raised { background: var(--surface-2); }
.menu, .modal{ background: var(--surface-3); box-shadow: var(--shadow-float); }
.muted       { color: var(--text-muted); }
a            { color: var(--accent); }

/* Dim media on dark so images don't blind */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) img:not([data-no-dim]),
  :root:not([data-theme="light"]) video { filter: brightness(.85) contrast(1.05); }
}

/* Toggle JS (put in a <script>):
   const root = document.documentElement;
   const saved = localStorage.getItem('theme');
   if (saved) root.dataset.theme = saved;
   function toggleTheme(){
     const next = (root.dataset.theme === 'dark') ? 'light' : 'dark';
     root.dataset.theme = next; localStorage.setItem('theme', next);
   }
*/
/* typography subset */
body{font-family:system-ui,sans-serif;line-height:1.55;margin:0;padding:2rem}h1{font-size:clamp(2rem,1.5rem + 2.5vw,3.5rem);line-height:1.1;text-wrap:balance}p{max-width:66ch;text-wrap:pretty}
</style></head><body>
<h1>Foundations demo — color, dark mode, type</h1>
<p class=lead>This paragraph tests measure (max 66ch), fluid heading, and themed token surfaces. Toggle below flips data-theme.</p>
<div class=card style="padding:1rem;margin:1rem 0">card on --surface-1</div>
<div class="card raised" style="padding:1rem;margin:1rem 0">raised on --surface-2</div>
<p class=muted>Muted secondary text (contrast-checked).</p>
<button class=btn onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'" style="padding:.6em 1.1em;border-radius:8px;border:0;background:var(--accent);color:#fff">Toggle theme</button>
</body></html>
