name: verify
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.11
            3.14
      - name: Vendored CLI matches the repository sources
        run: node tools/hermes/sync-plugin-vendor.mjs --check
      - name: Plugin tests (Python 3.11 and 3.14)
        run: |
          for py in python3.11 python3.14; do
            $py -m pip install --quiet pytest fastapi pydantic hypothesis
            $py -m pytest plugins/tastecheck-hermes/tests -q
          done
      - name: Gate dispatch through the real Hermes hook dispatcher (v0.21.6 pinned, no skips)
        env:
          TASTECHECK_REQUIRE_RUNTIME: "1"
        run: |
          set -e
          # The minimum supported runtime, pinned by commit (tag v0.21.6).
          # Hermes refuses wheel builds, so install the pinned checkout editable.
          git init -q /tmp/hermes-src
          git -C /tmp/hermes-src fetch -q --depth 1 https://github.com/NousResearch/hermes-agent 818c13be1dc4fd28987e1e881a9408224afd4535
          git -C /tmp/hermes-src checkout -q FETCH_HEAD
          # v0.21.6 declares its runtime dependencies for Python 3.14+ only.
          python3.14 -m venv /tmp/hermes-rt
          /tmp/hermes-rt/bin/pip install --quiet pytest -e /tmp/hermes-src
          /tmp/hermes-rt/bin/python -m pytest plugins/tastecheck-hermes/tests/test_gate_dispatch.py -q
      - name: Desktop half clean-room harness (stubbed SDK/react)
        run: node --import ./tests/register.mjs --test tests/harness.test.mjs tests/column-gate.test.mjs
        working-directory: plugins/tastecheck-hermes/desktop
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run preflight:structural
      - run: npm run test:tasteroll
      - run: npm run test:structural
      - run: npm run calibrate:check
      - name: Validate landing HTML (rules in .htmlvalidate.json; samples are scored design artifacts)
        run: npx --yes html-validate@9.7.1 index.html tasteroll.html
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run preflight:oracle
      - run: npx playwright install --with-deps chromium
      - run: npm run preflight:browser
      - run: npm run test:oracle
      - run: npm run test:cdp-qa
      - run: npm run test:profile
      - run: npm run calibrate:taste:check
        env:
          CI: "true"
      - run: npm run test:dogfood
  entry-point-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: python3 tools/quality/fail_closed_check.py --self-test
      - run: python3 tools/quality/fail_closed_check.py --discover .
