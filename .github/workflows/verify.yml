name: verify
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The Forgejo runners are Debian node:22 images that cannot use
      # setup-python or setup-uv. Install a pinned, hash-checked uv instead;
      # uv then fetches portable CPython builds for each version under test.
      - name: Install uv 0.11.22 (pinned, sha256-checked)
        run: |
          set -eu
          case "$(uname -m)" in
            x86_64) arch=x86_64; sum=30075b14624a62021198319f22e08f1651a97d4026a8c84dab6abcbfaba0d81c ;;
            aarch64|arm64) arch=aarch64; sum=54b22e9f5570f3643cdf85a33bbc8e9feb3fc6e836a7c660c05378434ef44fe2 ;;
            *) echo "unsupported runner arch $(uname -m)" >&2; exit 1 ;;
          esac
          tgz="uv-${arch}-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tgz" "https://github.com/astral-sh/uv/releases/download/0.11.22/$tgz"
          echo "$sum  $RUNNER_TEMP/$tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$HOME/.local/bin" --strip-components=1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" --version
      - name: Vendored CLI matches the repository sources
        run: node tools/hermes/sync-plugin-vendor.mjs --check
      - name: Plugin tests (Python 3.11 and 3.14)
        run: |
          set -e
          for py in 3.11 3.14; do
            uv run --no-project --python "$py" --with pytest --with fastapi --with pydantic --with hypothesis \
              python -m pytest plugins/tastecheck-hermes/tests -q
          done
      - name: Gate dispatch through the real Hermes hook dispatcher (v0.21.6 pinned, no skips)
        env:
          TASTECHECK_REQUIRE_RUNTIME: "1"
        run: |
          set -e
          # The minimum supported runtime, pinned by commit (tag v0.21.6).
          uv run --no-project --python 3.11 --with pytest \
            --with "hermes-agent @ git+https://github.com/NousResearch/hermes-agent@818c13be1dc4fd28987e1e881a9408224afd4535" \
            python -m pytest plugins/tastecheck-hermes/tests/test_gate_dispatch.py -q
      - name: Desktop half clean-room harness (stubbed SDK/react)
        run: node --import ./tests/register.mjs --test tests/harness.test.mjs tests/column-gate.test.mjs
        working-directory: plugins/tastecheck-hermes/desktop
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run preflight:structural
      - run: npm run test:tasteroll
      - run: npm run test:structural
      - run: npm run calibrate:check
      - name: Validate landing HTML (rules in .htmlvalidate.json; samples are scored design artifacts)
        run: npx --yes html-validate@9.7.1 index.html tasteroll.html
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run preflight:oracle
      - run: npx playwright install --with-deps chromium
      - run: npm run preflight:browser
      - run: npm run test:oracle
      - run: npm run test:cdp-qa
      - run: npm run test:profile
      - run: npm run calibrate:taste:check
        env:
          CI: "true"
      - run: npm run test:dogfood
  entry-point-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The Forgejo runners are Debian node:22 images that cannot use
      # setup-python or setup-uv. Install a pinned, hash-checked uv instead;
      # uv then fetches portable CPython builds for each version under test.
      - name: Install uv 0.11.22 (pinned, sha256-checked)
        run: |
          set -eu
          case "$(uname -m)" in
            x86_64) arch=x86_64; sum=30075b14624a62021198319f22e08f1651a97d4026a8c84dab6abcbfaba0d81c ;;
            aarch64|arm64) arch=aarch64; sum=54b22e9f5570f3643cdf85a33bbc8e9feb3fc6e836a7c660c05378434ef44fe2 ;;
            *) echo "unsupported runner arch $(uname -m)" >&2; exit 1 ;;
          esac
          tgz="uv-${arch}-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tgz" "https://github.com/astral-sh/uv/releases/download/0.11.22/$tgz"
          echo "$sum  $RUNNER_TEMP/$tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$HOME/.local/bin" --strip-components=1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" --version
      - run: npm ci
      - run: uv run --no-project --python 3.11 python tools/quality/fail_closed_check.py --self-test
      - run: uv run --no-project --python 3.11 python tools/quality/fail_closed_check.py --discover .
