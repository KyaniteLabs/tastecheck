name: verify
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.11
            3.14
      - name: Vendored CLI matches the repository sources
        run: node tools/hermes/sync-plugin-vendor.mjs --check
      - name: Plugin tests (Python 3.11 and 3.14)
        run: |
          for py in python3.11 python3.14; do
            $py -m pip install --quiet pytest fastapi pydantic
            $py -m pytest plugins/tastecheck-hermes/tests -q
          done
      - name: Desktop half clean-room harness (stubbed SDK/react)
        run: node --import ./tests/register.mjs --test tests/harness.test.mjs
        working-directory: plugins/tastecheck-hermes/desktop
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run preflight:structural
      - run: npm run test:tasteroll
      - run: npm run test:structural
      - run: npm run calibrate:check
      - name: Validate landing HTML (rules in .htmlvalidate.json; samples are scored design artifacts)
        run: npx --yes html-validate@9.7.1 index.html tasteroll.html
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run preflight:oracle
      - run: npx playwright install --with-deps chromium
      - run: npm run preflight:browser
      - run: npm run test:oracle
      - run: npm run test:cdp-qa
      - run: npm run test:profile
      - run: npm run calibrate:taste:check
        env:
          CI: "true"
      - run: npm run test:dogfood
  entry-point-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: python3 tools/quality/fail_closed_check.py --self-test
      - run: python3 tools/quality/fail_closed_check.py --discover .
