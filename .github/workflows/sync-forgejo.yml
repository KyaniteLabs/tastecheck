name: Sync Forgejo mirror

# GitHub is this repo's trunk; the Forgejo copy (KyaniteLabs/tastecheck) is a read-only
# mirror. After trunk CI passes on main, the shared workflow fast-forwards
# the mirror to that exact commit (fleet GIT-CI-STRATEGY-20261123). Runs when
# the repo variable FORGEJO_SYNC_ACTIVE is 'true' and pushes as the
# kyanite-mirror bot from the forgejo-mirror environment (armed 2026-11-23).
# See KyaniteLabs/.github docs/sync-forgejo.md.
on:
  workflow_run:
    workflows: ["verify"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: sync-forgejo-main
  cancel-in-progress: false

jobs:
  sync:
    if: vars.FORGEJO_SYNC_ACTIVE == 'true' && github.event.workflow_run.conclusion == 'success'
    uses: KyaniteLabs/.github/.github/workflows/sync-forgejo.yml@a9070204d393afce800230b4eefc809569b45a4a # main 2026-11-23
    with:
      trunk: main
      trigger-workflow-id: 294808218
      trigger-workflow-name: "verify"
      trigger-workflow-path: .github/workflows/verify.yml
      required-workflows: |
        294808218:.github/workflows/verify.yml
      forgejo-repository: KyaniteLabs/tastecheck
      downstream-workflow: none
      dry-run: false
      toolkit-ref: a9070204d393afce800230b4eefc809569b45a4a
    secrets: inherit
