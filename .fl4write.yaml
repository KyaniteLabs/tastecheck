repo: KyaniteLabs/tastecheck
forges:
  forgejo:
    role: primary
    api_base: https://git.kyanitelabs.tech/api/v1
    token_env: CODESITTER_FORGEJO_TOKEN
  github:
    role: mirror
    api_base: https://api.github.com
    token_env: CODESITTER_GITHUB_TOKEN
model:
  endpoint: https://api.deepinfra.com/v1/openai/chat/completions
  model: deepseek-ai/DeepSeek-V4-Flash-0731
  key_env: CODESITTER_DEEPSEEK_KEY
  temperature: 0.2
  max_tokens: 4000
fallback_model:
  endpoint: https://api.deepinfra.com/v1/openai/chat/completions
  model: deepseek-ai/DeepSeek-V4-Flash-0731
  key_env: CODESITTER_DEEPSEEK_KEY
  temperature: 0.2
  max_tokens: 4000
review:
  secrets: "Never commit or echo secrets, tokens, or credentials."
  tests: "Changes to logic ship with tests; tests stay green."
  security: "Flag injection, path traversal, unsafe deserialization, unbounded subprocess."
severity_vocab: [Critical, Major, Minor, Nit]
tone: balanced
tone_fork_override: balanced
fix:
  enabled: false  # Forgejo fix execution is not supported in v1.
  merge_own_prs: false
  max_fix_depth: 2
  fork_policy: comment-only
  dependency_policy: skip-patch
shadow: false
bot_login: fl4write
post_merge:
  enabled: true
  initial_lookback_h: 24
  max_per_cycle: 10
retro_audit:
  enabled: true
  lookback_days: 90
  max_per_cycle: 5
