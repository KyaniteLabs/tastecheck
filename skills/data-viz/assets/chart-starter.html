<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>data-viz starter — honest, token-driven, accessible</title>
<style>
/* Series + chart tokens come from color-system / dark-mode in a real project.
   Defaults here so the file stands alone. */
:root{
  --bg:#ffffff; --ink:#1a1a1a; --muted:#5b6b7a;
  --chart-bg:transparent; --axis:#9aa7b2; --grid:#e9edf1;
  --series-1:#0b6b53; --series-2:#c2521a; --series-3:#2f5fb0; /* distinguishable, CVD-aware */
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f1216;--ink:#eef2f5;--muted:#9fb0bd;--axis:#566370;--grid:#222a31;
        --series-1:#37d6a4;--series-2:#f0a259;--series-3:#7db0ff;}
}
body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;line-height:1.5;padding:2rem;max-width:64rem;margin-inline:auto}
figure{margin:0 0 2.5rem}
figcaption{font-weight:600;margin-bottom:.5rem}            /* the TAKEAWAY, in words */
figcaption .sub{font-weight:400;color:var(--muted);font-size:.92rem}
svg{width:100%;height:auto;display:block}
text{font-family:ui-sans-serif,system-ui,sans-serif;fill:var(--muted);font-size:.82rem}
.dlabel{fill:var(--ink);font-weight:600}                   /* direct labels */
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* table-first (often the right viz) */
table{border-collapse:collapse;font-variant-numeric:tabular-nums}
caption{text-align:left;font-weight:600;margin-bottom:.4rem}
th,td{padding:.35rem .8rem;border-bottom:1px solid var(--grid)}
td:not(:first-child),th:not(:first-child){text-align:right}
/* sparkline inline */
.spark{display:inline-block;vertical-align:middle;width:90px;height:22px}
</style></head>
<body>

<h1 style="font-size:1.3rem">data-viz starter — honest patterns</h1>

<!-- 1) HONEST LINE: range-frame axis (spans data range), direct end-label, no grid box, no chartjunk -->
<figure>
  <figcaption>Revenue grew 31% in Q2 2026 — the steepest quarter on record.
    <span class="sub">Quarterly revenue, $M</span></figcaption>
  <svg viewBox="0 0 640 240" role="img" aria-label="Quarterly revenue from Q1 2024 to Q2 2026, rising from 2.1 to 4.2 million dollars, steepest in Q2 2026.">
    <!-- range frame: x axis spans first→last, y axis spans min→max; ends labelled; no enclosing box -->
    <line x1="56" y1="200" x2="600" y2="200" stroke="var(--axis)"/>
    <line x1="56" y1="40" x2="56" y2="200" stroke="var(--axis)"/>
    <text x="56" y="218" text-anchor="middle">Q1 ’24</text>
    <text x="600" y="218" text-anchor="middle">Q2 ’26</text>
    <text x="48" y="44" text-anchor="end">4.2</text>
    <text x="48" y="204" text-anchor="end">2.1</text>
    <!-- the data -->
    <polyline fill="none" stroke="var(--series-1)" stroke-width="2"
      points="56,188 124,176 192,170 260,150 328,138 396,120 464,96 532,150 600,52"/>
    <circle cx="600" cy="52" r="3.5" fill="var(--series-1)"/>
    <text class="dlabel" x="592" y="44" text-anchor="end">$4.2M</text>  <!-- direct label, no legend -->
  </svg>
  <table class="visually-hidden"><caption>Quarterly revenue ($M)</caption>
    <thead><tr><th>Quarter</th><th>Revenue</th></tr></thead>
    <tbody><tr><td>Q1 2024</td><td>2.1</td></tr><tr><td>Q2 2026</td><td>4.2</td></tr></tbody>
  </table>
</figure>

<!-- 2) TABLE-FIRST: 6 numbers — a table beats a pie -->
<figure>
  <figcaption>Plan mix — most revenue is Pro.
    <span class="sub">6 numbers → a table, not a pie</span></figcaption>
  <table>
    <caption class="visually-hidden">Revenue by plan</caption>
    <thead><tr><th scope="col">Plan</th><th scope="col">Customers</th><th scope="col">Revenue</th></tr></thead>
    <tbody>
      <tr><td>Free</td><td>8,200</td><td>$0</td></tr>
      <tr><td>Pro</td><td>1,940</td><td>$291K</td></tr>
      <tr><td>Team</td><td>410</td><td>$184K</td></tr>
    </tbody>
  </table>
</figure>

<!-- 3) SPARKLINE: word-sized trend, inline in prose/table rows -->
<figure>
  <figcaption>Signups trend
    <svg class="spark" viewBox="0 0 90 22" role="img" aria-label="Signups trending up over 12 weeks">
      <polyline fill="none" stroke="var(--series-1)" stroke-width="1.5"
        points="0,18 8,16 16,17 24,12 32,13 40,9 48,10 56,7 64,8 72,5 80,4 90,2"/>
      <circle cx="90" cy="2" r="1.8" fill="var(--series-1)"/>
    </svg>
    <span class="sub">— up 4× since launch</span>
  </figcaption>
</figure>

</body></html>
