<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalog</title>
<style>
  body { font-family: Georgia, serif; margin: 0; padding: 24px; background: #fff; color: #111; }
  h1 { font-family: Georgia, serif; font-size: 28px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .card { width: 220px; height: 120px; padding: 16px; box-sizing: border-box; border: 1px solid #555; border-radius: 8px; }
  a { color: #0033aa; }
</style>
</head>
<body>
<main>
  <h1>Parts catalog</h1>
  <div class="row">
    <div class="card"><h2>Hinge</h2><p>Steel, 40 mm.</p></div>
    <div class="card"><h2>Bracket</h2><p>Zinc, 60 mm.</p></div>
    <div class="card"><h2>Latch</h2><p>Brass, 25 mm.</p></div>
  </div>
</main>
</body>
</html>
